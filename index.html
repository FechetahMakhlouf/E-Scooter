  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof PRODUCTS === 'undefined' || typeof getProductById !== 'function') return;
      var popularIds = ['q11-max', 'g63', 'm8-moto', 'n7-super'];
      popularIds.forEach(function (id) {
        var card = document.querySelector('[data-product-id="' + id + '"]');
        if (!card) return;
        var p = getProductById(id);
        if (!p) return;
        // Mettre a jour le prix (remplace le span avec data-i18n="price.note")
        var priceSpan = card.querySelector('[data-i18n="price.note"]');
        if (priceSpan && typeof formatPrice === 'function') {
          priceSpan.textContent = formatPrice(p.price);
          priceSpan.removeAttribute('data-i18n');
        }
        // Mettre a jour le subtitle si getProductText est disponible
        var subtitleEl = card.querySelector('.card-subtitle');
        if (subtitleEl && typeof getProductText === 'function') {
          var sub = getProductText(p, 'subtitle');
          if (sub) subtitleEl.textContent = sub;
        }
        var subtitleEl = card.querySelector('.card-subtitle');
        if (subtitleEl && typeof getProductText === 'function') {
          var sub = getProductText(p, 'subtitle'); // utilise la langue actuelle
          if (sub) {
            subtitleEl.textContent = sub;
          }
        }
      });
    });
  </script>
